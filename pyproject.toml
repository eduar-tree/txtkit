[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "eduar-tree-txtkit"
version = "0.1.0"
description = "标准库 Unix 风格的文本处理小工具集"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "eduar-tree" }]
keywords = ["text", "unix", "cli", "grep"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/eduar-tree/txtkit"
Repository = "https://github.com/eduar-tree/txtkit"
Issues = "https://github.com/eduar-tree/txtkit/issues"

[project.scripts]
txtkit = "txtkit:main"

[tool.setuptools]
py-modules = ["txtkit"]
